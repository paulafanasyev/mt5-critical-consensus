[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5-critical-consensus"
version = "0.2.0"
description = "Fail-closed multi-agent critical consensus reference scaffold for MT5"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "PyYAML>=6.0,<7.0",
  "redis>=5.0,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10.0.0", "pytest-asyncio>=0.24,<2.0", "httpx2>=2.0,<3.0", "jsonschema>=4.23,<5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
