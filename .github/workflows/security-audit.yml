name: security-audit
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit bandit
      - run: pip install -e '.[dev]'
      - name: Audit installed dependencies against known advisories
        run: pip-audit --skip-editable
      - name: Scan Python source with Bandit
        run: bandit -r src -ll
