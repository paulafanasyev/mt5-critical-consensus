name: mql5-compile

on:
  push:
    paths:
      - "mql5/**"
      - ".github/workflows/mql5-compile.yml"
  pull_request:
    paths:
      - "mql5/**"
      - ".github/workflows/mql5-compile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metaeditor-compile:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Download official MetaTrader 5 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile $installer
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne "Valid") {
            throw "MetaTrader installer signature is not valid: $($signature.Status)"
          }
          Write-Host "Verified official installer signature: $($signature.SignerCertificate.Subject)"

      - name: Install MetaTrader 5 and compile the EA
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          $process = Start-Process -FilePath $installer -ArgumentList "/auto" -PassThru -Wait
          Write-Host "Installer exit code: $($process.ExitCode)"

          $editor = $null
          $roots = @(
            (Join-Path $env:ProgramFiles "MetaTrader 5"),
            (Join-Path $env:ProgramFiles "MetaTrader 5 Terminal"),
            (Join-Path $env:LOCALAPPDATA "Programs")
          )
          foreach ($root in $roots) {
            if (Test-Path $root) {
              $candidate = Get-ChildItem -Path $root -Filter "metaeditor64.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($candidate) { $editor = $candidate.FullName; break }
            }
          }
          if (-not $editor) {
            throw "MetaEditor was not installed or could not be located. Installer exit code: $($process.ExitCode)"
          }

          $terminalRoot = Split-Path $editor -Parent
          $experts = Join-Path $terminalRoot "MQL5\Experts"
          New-Item -ItemType Directory -Force -Path $experts | Out-Null
          $source = Join-Path $PWD "mql5\CriticalConsensusEA.mq5"
          $target = Join-Path $experts "CriticalConsensusEA.mq5"
          Copy-Item $source $target -Force

          $compile = Start-Process -FilePath $editor -ArgumentList @("/compile:`"$target`"", "/log") -PassThru -Wait
          $log = "$target.log"
          if (-not (Test-Path $log)) {
            throw "MetaEditor did not create a compiler log. Process exit code: $($compile.ExitCode)"
          }
          Get-Content $log
          $logText = Get-Content $log -Raw
          if ($logText -match "(?im)\b[1-9]\d* errors?\b" -or $logText -notmatch "(?im)\b0 errors?\b") {
            throw "MQL5 compilation did not report zero errors."
          }
          if ($logText -match "(?im)\b[1-9]\d* warnings?\b") {
            Write-Warning "MetaEditor reported compiler warnings; review the uploaded log."
          }
          $ex5 = [System.IO.Path]::ChangeExtension($target, ".ex5")
          if (-not (Test-Path $ex5)) {
            throw "Compiler log reports no errors but the expected EX5 artifact is missing."
          }
          Write-Host "PASS: MetaEditor produced CriticalConsensusEA.ex5 with zero compiler errors."

      - name: Upload MetaEditor compiler evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mql5-metaeditor-compile-evidence
          path: |
            **/CriticalConsensusEA.mq5.log
            **/CriticalConsensusEA.ex5
          if-no-files-found: warn
