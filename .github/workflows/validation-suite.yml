name: validation-suite

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse Windows MT5 sync wrapper
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/run_mt5_sync.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | Format-List *
            exit 1
          }
          Write-Host "PASS: PowerShell sync wrapper syntax is valid."

  unit-and-static:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project and data adapters
        run: python -m pip install --upgrade pip && pip install -e '.[dev,data]'
      - name: Compile all Python source and operational scripts
        run: python -m compileall -q src scripts
      - name: Unit and contract tests
        run: pytest -q
      - name: Static MQL5 safety guards (not a compile)
        run: python scripts/check_mql5_safety.py

  security:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependency audit tools and application
        run: python -m pip install --upgrade pip pip-audit bandit && pip install -e '.[dev,data]'
      - name: Audit known dependency advisories
        run: pip-audit --skip-editable
      - name: Bandit high-confidence findings
        run: bandit -r src -ll

  postgres-redis-integration:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mt5cc_test
          POSTGRES_USER: mt5cc
          POSTGRES_PASSWORD: mt5cc-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mt5cc -d mt5cc_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mt5cc:mt5cc-test-only@127.0.0.1:5432/mt5cc_test
      TEST_DATABASE_URL: postgresql://mt5cc:mt5cc-test-only@127.0.0.1:5432/mt5cc_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project and data adapters
        run: python -m pip install --upgrade pip && pip install -e '.[dev,data]'
      - name: PostgreSQL and Redis integration tests
        run: pytest -q tests/test_persistence_integration.py tests/test_redis_postgres_integration.py tests/test_full_stack_integration.py
