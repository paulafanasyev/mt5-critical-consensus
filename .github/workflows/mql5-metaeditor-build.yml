name: mql5-metaeditor-build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mql5-metaeditor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  metaeditor-build:
    name: MetaEditor compile (Windows)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download official MetaTrader 5 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile $installer
          if (-not (Test-Path $installer) -or (Get-Item $installer).Length -lt 100000) {
            throw "The official MetaTrader 5 installer download is missing or unexpectedly small."
          }

      - name: Install MetaTrader 5 in isolated runner
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installDir = Join-Path $env:RUNNER_TEMP "MT5"
          New-Item -ItemType Directory -Path $installDir -Force | Out-Null
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          $signature = Get-AuthenticodeSignature $installer
          Write-Host "Installer signature: $($signature.Status); signer: $($signature.SignerCertificate.Subject)"
          $arguments = '/auto /path:"' + $installDir + '"'
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          Write-Host "Bootstrap installer exit code: $($process.ExitCode)"
          $editor = Join-Path $installDir "metaeditor64.exe"
          $includeRoot = Join-Path $installDir "MQL5"
          $deadline = (Get-Date).AddMinutes(3)
          while (-not (Test-Path $editor) -and (Get-Date) -lt $deadline) {
            if ((Get-Date).Second % 30 -lt 5) {
              Write-Host "Waiting for MetaEditor payload. Install directory exists: $(Test-Path $installDir)"
              if (Test-Path $installDir) {
                Get-ChildItem $installDir -Force | Select-Object -First 15 | Format-Table Name, Length
              }
            }
            Start-Sleep -Seconds 5
          }
          if (-not (Test-Path $editor)) {
            Write-Host "Install directory diagnostics:"
            if (Test-Path $installDir) {
              Get-ChildItem $installDir -Force -Recurse -ErrorAction SilentlyContinue |
                Select-Object -First 40 FullName, Length | Format-Table
            } else {
              Write-Host "Install directory was not created."
            }
            throw "MetaEditor64.exe was not installed. Bootstrap exit code: $($process.ExitCode)."
          }
          # The current EA has no #include dependencies; MetaEditor only needs a valid include root.
          New-Item -ItemType Directory -Path $includeRoot -Force | Out-Null
          $version = (Get-Item $editor).VersionInfo.FileVersion
          "MT5_INSTALL_DIR=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "METAEDITOR_PATH=$editor" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MetaEditor file version: $version"
          "MetaEditor file version: $version" >> $env:GITHUB_STEP_SUMMARY

      - name: Generate, compile and record demo EA provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path "artifacts\demo_ea" -Force | Out-Null
          $buildOutput = python scripts/build_demo_ea.py --compile --metaeditor "$env:METAEDITOR_PATH" --include-dir "$env:MT5_INSTALL_DIR\MQL5" --out "artifacts\demo_ea"
          $buildExit = $LASTEXITCODE
          $buildText = ($buildOutput | Out-String).Trim()
          if ($buildExit -ne 0) {
            Write-Host $buildText
            throw "The demo EA generation or MetaEditor compilation failed."
          }
          $buildResultPath = "artifacts\demo_ea\build-result.json"
          $buildText | Set-Content -LiteralPath $buildResultPath -Encoding utf8
          $buildResult = $buildText | ConvertFrom-Json
          $binary = "artifacts\demo_ea\CriticalConsensusEA_Demo.ex5"
          $source = "artifacts\demo_ea\CriticalConsensusEA_Demo.mq5"
          $log = "artifacts\demo_ea\CriticalConsensusEA_Demo.log"
          foreach ($file in @($binary, $source, $log, $buildResultPath)) {
            if (-not (Test-Path $file) -or (Get-Item $file).Length -eq 0) {
              throw "Expected build output is missing or empty: $file"
            }
          }
          if ($buildResult.compiled -ne $true -or $buildResult.gate_enabled -ne $true -or $buildResult.errors -ne 0) {
            throw "Build result does not prove a clean demo-enabled compilation."
          }
          $sourceText = Get-Content -LiteralPath $source -Raw
          if ($sourceText -notmatch 'const bool ENABLE_DEMO_EXECUTION = true;') {
            throw "Generated demo EA does not contain the expected enabled demo gate."
          }
          if ($sourceText -notmatch 'input bool AllowLiveExecution = false;') {
            throw "Generated EA does not keep live execution disabled by default."
          }
          $metaVersion = (Get-Item $env:METAEDITOR_PATH).VersionInfo.FileVersion
          $resultLine = Get-Content -LiteralPath $log | Where-Object { $_ -match '^Result:' } | Select-Object -Last 1
          if (-not $resultLine) { throw "MetaEditor result line is missing from the compiler log." }
          $sourceHash = (Get-FileHash $source -Algorithm SHA256).Hash
          $binaryHash = (Get-FileHash $binary -Algorithm SHA256).Hash
          $logHash = (Get-FileHash $log -Algorithm SHA256).Hash
          $manifest = [ordered]@{
            schema_version = 1
            source_commit = $env:GITHUB_SHA
            workflow_run_id = $env:GITHUB_RUN_ID
            metaeditor_version = $metaVersion
            compiler_result_line = $resultLine
            errors = [int]$buildResult.errors
            warnings = [int]$buildResult.warnings
            demo_execution_gate_enabled = [bool]$buildResult.gate_enabled
            live_execution_default_disabled = $true
            source_sha256 = $sourceHash
            ex5_sha256 = $binaryHash
            compiler_log_sha256 = $logHash
            ex5_size_bytes = (Get-Item $binary).Length
          }
          $manifestPath = "artifacts\demo_ea\build-manifest.json"
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $manifestPath -Encoding utf8
          "Demo EA EX5 SHA-256: $binaryHash" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Build manifest:" | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-Content -LiteralPath $manifestPath | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-Content -LiteralPath $log -Tail 20

      - name: Upload compiled demo EA and compiler evidence
        uses: actions/upload-artifact@v4
        with:
          name: mt5-demo-ea-windows
          path: |
            artifacts/demo_ea/CriticalConsensusEA_Demo.mq5
            artifacts/demo_ea/CriticalConsensusEA_Demo.ex5
            artifacts/demo_ea/CriticalConsensusEA_Demo.log
            artifacts/demo_ea/build-result.json
            artifacts/demo_ea/build-manifest.json
          if-no-files-found: error
          retention-days: 14
