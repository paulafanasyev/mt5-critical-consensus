      не первая; февраль — среда 11-е; май — пятница 8-е, вторая; июль — четверг 2-е
      (пятница 3-е — наблюдаемое закрытие по 4 июля). Даты взяты из графика BLS (Schedule
      of Selected Releases 2026), публикуемого заранее. Релиз 08:30 по Нью-Йорку:
      12:30 UTC в EDT и 13:30 UTC в EST — поэтому у окна ДВЕ скобки, а не одна.
