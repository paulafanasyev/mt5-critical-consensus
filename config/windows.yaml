# ---------------------------------------------------------------------------
# РИСК-СОСТОЯНИЯ, У КОТОРЫХ НЕТ КАЛЕНДАРЯ.
# Это не окна: они не срабатывают по дате, и заводить для них строку в windows значило
# бы выдать календарь за то, чего у него нет.
# ---------------------------------------------------------------------------
risk_states:
  - id: jpy_intervention
    label: "Валютная интервенция MoF по иене"
    applies_to: [fx]
    status: "не имеет расписания — это состояние, а не событие"
    why: >
      Интервенцию не анонсируют заранее: Министерство финансов Японии действует, когда
      сочтёт курс «крайне несбалансированным», и объявляет о ней постфактум (или за
      минуты). Любая скобка здесь — не прогноз, а дежурство: окно, в котором MoF ФИЗИЧЕСКИ
      может действовать, потому что расчёт идёт через японские банки в рабочие часы
      Токио. Исторические эпизоды концентрируются в первой половине дня Токио и в
      пересменку Токио–Нью-Йорк; это наблюдение из открытой прессы, а не измерение этой
      машины, и потому оно стоит гипотезой, а не числом.
    watch_local_band: "09:00–21:00 Токио (JST не переходит на летнее время)"
    watch_utc_band: "00:00–12:00 UTC"
    guardrail: >
      Практическое следствие для исполнителя: в этом коридоре по USDJPY стоп-лоссы
      держатся вдвое дальше обычного, а новый вход в иене-ноге не планируется вовсе.
      Проверить постфактум можно по записям MoF/FTSY; на этой машине записанных баров
      USDJPY нет, поэтому и состояния по нему не измеримы.
  - id: blint_intervention_escalation
    label: "Реакция G7/Минфина США на уровень иены"
    applies_to: [fx]
    status: "не имеет расписания"
    why: >
      Вероятность интервенции растёт не по календарю, а по уровню и по риторике; это
      состояние портфеля, а не окно. Помечено здесь, чтобы расписание не создавало
      впечатления, что все риски США/Японии уже разложены по строкам.

# ---------------------------------------------------------------------------
# ОКНА
# ---------------------------------------------------------------------------
windows:

  # ---------------- ДНЕВНОЙ МАСШТАБ ----------------

  - id: asia_session
    local_name: "Азиатская сессия (Сидней/Токио)"
    scale: daily
    timezone_kind: utc_fixed
    applies_to: [gold, silver, fx]
    utc: {start_minute: 0, end_minute: 300}
    rule: {kind: daily, weekdays: [0, 1, 2, 3, 4]}
    why: >
      Физический спрос на золото живёт в Азии: Shanghai Gold Exchange (SGE, спотовый и
      ночной рынок Шанхая) и японская площадка (бывший TOCOM, после слияния — OSE) —
      там импортные премии и основной объём по металлу. книго держания в паре
      EURUSD/GBPUSD в эти часы тонкая: европейских и американских дилеров нет,
      маркетмейкеры торгуют узкие лимиты. (Название «Shanghai ICE» в прошлой ревизии
      было ошибкой: ICE — Intercontinental Exchange, к шанхайскому золоту отношения не
      имеет; шанхайская площадка — SGE.)
    expected: >
      Предзарегистрированная гипотеза — тонкая ликвидность и малые смещения; медианный
      относительный диапазон H1 ниже суточного фона.
    criterion:
      metric: median_abs_rel_range_ratio_inside_vs_outside
      op: "<="
      value: 0.85
      text: >
        медиана |high-low|/mid внутри окна <= 0.85 x медианы вне окна, на записанных
        H1-барах, по каждому инструменту класса отдельно.
    # вторая критериальная линия окна: СПРЕД, то есть «чем тут торговать»,
    # а не только «заметно ли движение».
    spread_criterion:
      metric: median_spread_points_ratio_inside_vs_outside
      op: "<="
      value: 1.5
      text: >
        медиана записанного лентой спреда внутри окна должна быть <= 1.5 x медиана общего фона
        суток. Это линия про ИСПОЛНИМОСТЬ, а не про гипотезу: 0.01 лота металла стоит вход только
        если проход не дороже обещанного движения. Предел 1.5 — общий константный порог движка
        (SPREAD_THIN_MULTIPLE), не подобранное под ответ число.
    action: avoid
    action_basis: >
      avoid как авторское ожидание до замера; окончательное значение
      выводит измерение (scripts/windows_evidence.py --apply сверяет его
      с этим полем и переписывает, если они разошлись).
    measured:
      source: ["agent_data/forward_bars/XAUUSD.json", "agent_data/forward_bars/XAGUSD.json", "agent_data/forward_bars/EURUSD.json", "agent_data/forward_bars/GBPUSD.json"]
      generated_at: "2026-11-05"
      timeframe: H1
      metric: median_abs_rel_range_ratio_inside_vs_outside
      baseline: pooled_day_background
      symbols_measured: ["XAUUSD", "XAGUSD", "EURUSD", "GBPUSD"]
      symbols_without_bars: ["USDJPY"]
      n_inside_bars: 1740
      n_baseline_bars: 6260
      n_event_days: 91
      n_event_days_by_season: {fixed: 91}
      season_in_effect_at_measurement: fixed
      median_rel_range_inside: 0.002085
      median_rel_range_baseline: 0.001975
      ratio: 1.056
      ratio_noise_band_p10_p90: [0.917, 1.193]
      ratio_within_symbol_median: 0.89
      ratio_within_symbol_note: "объединённая медиана смешивает металлы и валюту; по-символьные отношения — вот здесь, критерий при этом остаётся на предзарегистрированном объединённом числе"
      ratio_within_symbol_span: [0.652, 1.11]
      criterion: "<= 0.85"
      criterion_holds: FAIL
      # вторая критериальная линия: СПРЕД, а не только диапазон
      spread_metric: median_spread_points_ratio_inside_vs_outside
      spread_baseline: pooled_day_background
      spread_criterion: "<= 1.5"
      spread_ratio: 1.889
      spread_ratio_driver: "XAGUSD"
      median_spread_points_inside: 34.0
      median_spread_points_outside: 18.0
      n_spread_bars_inside: 411
      n_spread_bars_outside: 1381
      spread_coverage_inside: 0.9033
