  - id: first_hour_of_month
    local_name: "Первый час месяца (00:00–01:00 UTC первого торгового дня)"
    scale: monthly
    timezone_kind: utc_fixed
    applies_to: [gold, silver, fx]
    utc: {start_minute: 0, end_minute: 60}
    rule:
      kind: monthly_day
      day: 1
      skip_weekend: true
    rule_note: >
      skip_weekend: если 1-е число — суббота/воскресенье ИЛИ биржевой праздник, окно
      переносится на первый торговый день месяца (праздничная фильтрация добавлена этим
      раундом: без неё 1 января 2027, пятница и закрытие, давало бы «торговое окно» по
      запертой книге). рыночная механика — поток первого торгового тика.
    why: >
      Систематические месячные потоки (ребаланс фондов, хеджирование, опционные страйки
      по открытию месячной свечи) исполняются на первом доступном тике; тонкая азиатская
      книга в эти часы даёт им усиленное ценовое воздействие.
    expected: >
      Предзарегистрированная гипотеза — повышенное смещение в первый час против тех же
      часов других дней.
    criterion:
      metric: median_abs_rel_range_ratio_inside_vs_hour_matched_outside
      op: ">="
      value: 1.2
      text: >
        медиана |high-low|/mid внутри >= 1.2 x медиана того же часа в другие дни
        (записанные H1).
