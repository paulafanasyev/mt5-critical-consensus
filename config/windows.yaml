      dst: {start_minute: 840, end_minute: 1080}    # 14:00–18:00 UTC = 09:00–13:00 CDT
      std: {start_minute: 900, end_minute: 1140}    # 15:00–19:00 UTC = 09:00–13:00 CST
    rule:
      kind: monthly_nth_trading_day_from_end
      nth_from_end: 2
    why: >
      Переток открытого интереса в дальний контракт, межконтрактный базис и окно
      физической поставки — структурный поток, независимый от «настроений».
    expected: >
      Гипотеза без права называться свидетельством, пока день экспирации не сверен с
      регламентом: повышенная активность американской сессии дня ролла относительно тех
      же часов других дней.
    criterion:
      metric: median_abs_rel_range_ratio_inside_vs_hour_matched_outside
      op: ">="
      value: 1.1
      text: >
        медиана |high-low|/mid внутри >= 1.1 x медиана той же скобки в другие дни
        (записанные H1).
    # вторая критериальная линия окна: СПРЕД, то есть «чем тут торговать»,
    # а не только «заметно ли движение».
    spread_criterion:
      metric: median_spread_points_ratio_inside_vs_hour_matched_outside
      op: "<="
      value: 1.3
      text: >
        медиана записанного лентой спреда внутри окна должна быть <= 1.3 x медиана ТЕХ ЖЕ часов в
        другие дни (hour-matched, как и у диапазона). Окна с короткой реакцией держат предел 1.3
        жёстче обычных: у них и издержка, и горизонт короче, поэтому 30 % расширения спреда съедают
        большую долю стояния. Порог взят из констант движка, а не подогнан под измерение.
    action: neutral
