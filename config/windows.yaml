# Расписание торговых окон — «предсказывай окна заранее».
#
# Один источник истины для всех масштабов: день / неделя / месяц. Окна бывают двух
# ПРИРОД, и они больше не описываются одной формулой, потому что это была ошибка:
#
#   1) utc_fixed — окно как ПОЛОСА UTC-СУТОК (азиатская сессия). Граница не двигается
#      никогда, это осознанно.
#   2) local_anchored — окно как СОБЫТИЕ НА ЧЬИХ-ТО ЧАСАХ: релиз в 08:30 по Нью-Йорку,
#      кэш-открытие в 09:30, стейтмент FOMC в 14:00, аукцион Treasury в 13:00. Держать
#      для такого фиксированную UTC-скобку нельзя: после 2026-11-01 релиз 08:30 ET
#      приходит в 13:30 UTC, и скобка 12:30–14:00 тратит первый час на ДО-релизную
#      тишину и забирает только половину реакции. Такие окна несут ОБЕ скобки
#      (utc_seasons.dst / utc_seasons.std), и движок выбирает их по дате.
#
# Правила перехода — календарная арифметика, а не библиотека и не оценка: в США это
# второе воскресенье марта и первое воскресенье ноября, в ЕС — последнее воскресенье
# марта и октября. Они известны на годы вперёд, поэтому их можно выводить, а не помнить.
# Пара скобок проверяется на одинаковую ЛОКАЛЬНУЮ геометрию (зимняя стартует ровно на
# 60 минут позже летней, длительность совпадает): окно не может незаметно поменять
# утверждение, пока следует за часами.
#
# Числа в expected/criterion — либо измерены на записанных барах (тогда в measured лежат
# файл, дата снятия и выборка, причём РАЗДЕЛЬНО по сезонам: скобка, ни разу не
# сработавшая зимой, не имеет зимнего доказательства), либо помечены как гипотеза.
# Ни одно число сюда не перенесено из старой заметки или из «статей про сессии».
#
# ДВЕ ОСИ, а не одна. Раньше их не различали, и от этого ломалось всё: «тихо» и «не
# доказано» печатались одним словом, а «статистически заметно» читалось как «можно торговать».
#
# ОСЬ 1. ВЕРДИКТ — чистая статистика предзарегистрированного критерия диапазона:
#   PASS        — критерий этого окна выполнен на этой выборке;
#   FAIL        — не выполнен (для окон-тишунов с `<=` высокое отношение — это именно FAIL,
#                 и он напечатан, а не спрятан);
#   HYPOTHESIS  — ТОЛЬКО тонкая выборка: n_event_days <= 5 (THIN_SAMPLE_EVENT_DAYS). При
#                 таком числе срабатываний арифметика есть, а права называть её
#                 доказательством нет;
#   NOT_MEASURED— метрика по барам неотделима или событий в записи нет (n < 2 — окно
#                 не отчитывается вовсе, это правило неизменно).
# Всё прочее — неизмеренная зимняя половина скобки, порог внутри шумового коридора,
# закрытая или тонкая книга, растянутый спред — печатается ОГОВОРКАМИ к вердикту
# (verdict_reasons) и живёт на оси 2. Окно с 91 срабатыванием не имеет права прятаться за
# HYPOTHESIS: в прошлой ревизии именно так и было — 15 окон из 20 имели вердикт HYPOTHESIS,
# включая new_york_open с отношением 1.982 на 90 срабатываниях, и лестница переставала
# различать измерение и анекдот.
# Про сезон (оговорка, не вердикт): запись обрывается на 2026-11-02 12:00 UTC, то есть в ней
# нет ни одного послеполуденного бара после перевода американских часов. Любая скобка на
# нью-йоркских или чикагских часах сегодня (5 ноября — EST/CST) торгует геометрией, которую
# эта запись не видела ни разу (dst=90, std=0): PASS по летней половине — это PASS по
# летней половине, и артефакт обязан говорить это вслух.
#
# ОСЬ 2. ACTION — исполнимость: enter | avoid | neutral. Отвечает на вопрос «можно ли это
# торговать» и выводится из измерения (scripts/windows_evidence.py --apply переписывает его
# по замеру, валидатор не даёт рукописному значению расходиться с выводом):
#   avoid — тихая или закрытая книга, тонкая книга по покрытию слотов, спред внутри окна
#           >= 1.5 x его же базы, провал ВТОРОЙ критериальной линии окна (по спреду), спред,
#           съедающий >= 25 % часового диапазона, и календарно опасные часы (`hazard`:
#           открытие недели после выходных, первый бар понедельника, среда тройного свепа,
#           ролловер на серверной полночи). ГЛАВНОЕ ПРАВИЛО: PASS по критерию ТИШИНЫ (`<=`)
#           никогда не рендерится enter — «книга измерена спокойной» означает отсутствие
#           движения, а не сигнал; rollover (0.27) и пятничное закрытие тихи именно потому,
#           что в эти часы записи нет (XAUUSD: 0 из 91 слота в 21:00 UTC, 4 из 91 в 22:00).
#   enter — только PASS по критерию АКТИВНОСТИ (`>=`) при EXECUTABLE-книге, измеренном и
#           выполненном спреде, не тонкой выборке и видимой в записи действующей сезонной
#           половине скобки;
#   neutral — всё остальное: FAIL, HYPOTHESIS, неизмеренный спред, неизмеренная геометрия.
#
# Что измеримо, а что нет, на этой машине (2026-11-05):
#   агентские sqlite (agent_data/*.db) — это только аудит событий, баров там нет;
#   bars есть в agent_data/forward_bars/*.json с явными UTC-метками (EURUSD, GBPUSD,
#   XAUUSD, XAGUSD, 2000 часовых баров на инструмент, 26 июн – 2 ноя 2026);
#   AUDUSD и NZDUSD-файлы в той же папке лежат, но в классы инструментов не включены,
#   потому что ни одна гипотеза этого раунда под них не предзарегистрирована — включать
#   их в выборку задним числом значит подгонять базу под ответ.
#   USDJPY записанных часовых баров на этой машине нет -> ВСЕ окна для USDJPY остаются
#   неизмеренными гипотезами; в списках инструментов он помечен кинжалом (†).
#   D1-корзина (agent_data/daily) годится только для календарных дат (брокерская дата
#   бара, без смещения сервера), не для внутридневных часов.
#
# Никаких тиковых полей брокера: метрика измеряется только по барам
# (open/high/low/close), потому что metal tick-поля на этом фиде ошибочны ~в 10 раз.
# Поле `spread` ИЗ ФАЙЛОВ БАРОВ — вторая критериальная линия каждого окна, но сначала
# аудируется сама колонка (покрытие, число значений, доля мода и РАЗЛИЧИЕ ЧАСОВЫХ МЕДИАН):
#   XAGUSD — покрытие ~90 %, 39 значений, часовые медианы ходят 18..34 пунктов (1.89x):
#            колонка годится, и именно она держит ось avoid (азиатские часы дороже почти
#            вдвое);
#   XAUUSD — покрытие ~92 %, но часовая медиана 8.0 стоит в 21 часу из 22 (различие 1.0x):
#            колонка ВЫРОЖДЕНА, по ней окна не различимы, и отношение золота НЕ печатается
#            измерением, хотя значений в файле больше двух;
#   EURUSD/GBPUSD — покрытие ~2 % при моде 19/23 пунктов: форекс-спред печатается
#            НЕ ИЗМЕРЕННЫМ вместе с покрытием, а не нулём, и enter по нему не выдаётся.
# Пороги второй линии (1.5x и 25 % часового диапазона) — общие константы движка
# (SPREAD_THIN_MULTIPLE, SPREAD_COST_KILL), а не подобранная под ответ величина; окна с
# короткой реакцией (релизы, аукционы, экспирации, первый час месяца) держат предел 1.3x,
# потому что у них и издержка, и горизонт короче.

version: 2
generated: "2026-11-05"
timezone_policy: "hybrid: utc_fixed для полос суток, local_anchored для событий"
timezone_note: >
  start_minute/end_minute — минуты от полуночи UTC. Окно с end_minute < start_minute
  считается переходящим через полночь. Окна с utc_seasons несут две скобки, и choice
  делает windows_schedule.resolve_bracket по дате. Серверное время брокера (известен
  сдвиг +7200 c на MetaQuotes-Demo) нигде не принимается за UTC; измерение опирается
  только на файлы с явными UTC-метками.

# ---------------------------------------------------------------------------
# РЕЕСТР ИНСТРУМЕНТОВ: что на этой машине реально записано, а что только торгуется.
# Класс инструмента может включать символ без баров — тогда окно для него гипотеза,
# и ни один замер не вправе притворяться, что он про этот инструмент.
# ---------------------------------------------------------------------------
symbols:
  XAUUSD: {recorded: true, bars: agent_data/forward_bars/XAUUSD.json, digits: 2}
  XAGUSD: {recorded: true, bars: agent_data/forward_bars/XAGUSD.json, digits: 3}
  EURUSD: {recorded: true, bars: agent_data/forward_bars/EURUSD.json, digits: 5}
  GBPUSD: {recorded: true, bars: agent_data/forward_bars/GBPUSD.json, digits: 5}
  USDJPY: {recorded: false, bars: null, digits: 3}
  AUDUSD: {recorded: true, bars: agent_data/forward_bars/AUDUSD.json, digits: 5,
           in_use: false, note: "файл есть; в классы не включён — под него нет
                                 предзарегистрированной гипотезы этого раунда"}
  NZDUSD: {recorded: true, bars: agent_data/forward_bars/NZDUSD.json, digits: 5,
           in_use: false, note: "то же"}

instrument_classes:
  gold:
    label: "Золото"
    symbols: [XAUUSD]
  silver:
    label: "Серебро"
    symbols: [XAGUSD]
  fx:
    label: "Форекс-мажоры (USD-счёт)"
    symbols: [EURUSD, GBPUSD, USDJPY]

evidence_sources:
  forward_bars:
    path: agent_data/forward_bars
    symbols: [EURUSD, GBPUSD, XAUUSD, XAGUSD]
    timeframe: H1
    stamping: "явный UTC ISO в поле time"
    fields: [time, o, h, l, c, spread]
  daily_basket:
    path: agent_data/daily
    symbols: [XAUUSD, XAGUSD, EURUSD, AUDUSD, NZDUSD]
    timeframe: D1
    stamping: "брокерская дата бара (d); смещение сервера не применяется"
  usdjpy_bars: null   # записанных баров USDJPY на этой машине нет

# ---------------------------------------------------------------------------
# ПРАЗДНИЧНЫЙ КАЛЕНДАРЬ.
#
# Без него расписание предсказывало торговое окно на день, где книги нет. Единственный
# провал, который виден прямо в этой записи: XAUUSD замолкает 2026-07-03 в 18:00 UTC и
# возвращается только 2026-07-05 в 23:00 — это закрытие по Дню независимости (4 июля
# 2026 приходится на субботу, биржи переносят наблюдение на пятницу). Всё остальное
# ниже — календарные правила (NYSE/US bank holidays), а не память о записи; они
# пересчитываются из правила дня, а не переписываются из чьего-то обзора.
#
# kind: closed      — окно ВЫЧИТАЕТСЬ из расписания (производные правила daily/weekly/
#                     monthly_*); торговаться там не с чем.
# kind: early_close — окно остаётся, но печатается пометка: сокращённая сессия, часть
#                     скобки приходится на закрытую книгу (исполнимость measure это и
#                     покажет покрытием баров).
# Буквальные даты релизов (BLS/Фед) из календаря НЕ вычищаются: ведомства сами
# переносят релиз вокруг праздника; столкновение помечается в выводе.
# ---------------------------------------------------------------------------
