  - id: wednesday_triple_swap
    local_name: "Среда: тройной своп за выходные"
    scale: weekly
    timezone_kind: local_anchored
    season_region: europe_frankfurt
    anchor_local: "полночь по серверу брокера (EET/EEST)"
    applies_to: [gold, silver, fx]
    utc: {start_minute: 1260, end_minute: 1350}
    utc_seasons:
      dst: {start_minute: 1260, end_minute: 1350}   # GMT+3 летом -> 21:00–22:30 UTC
      std: {start_minute: 1320, end_minute: 1410}   # GMT+2 зимой -> 22:00–23:30 UTC
    rule: {kind: weekly, weekday: 2}
    why: >
      Конвенция своп-расчёта: брокер списывает своп за трое суток в один штампованный
      Wednesday-ролловер, поэтому стоимость держания позиции через выходные концентрируется
      в эти часы и фонды подстраивают книги под неё.
    expected: >
      Утверждение не про движение цены, а про издержку: по часовым барам неотделимо от
      обычного ролловера; требует сверки со своп-строками выписки.
    criterion:
      metric: swap_charge_triple_on_wednesday_vs_other_days
      op: "=="
      value: 3
      text: >
        сумма свопов по позиции, открытой в будни и держанной через среду, за среду =
        3x однодневного своп-платежа (сверка по account statement / audit events).
    # вторая критериальная линия окна: СПРЕД, то есть «чем тут торговать»,
    # а не только «заметно ли движение».
    spread_criterion:
      metric: median_spread_points_ratio_inside_vs_hour_matched_outside
      op: "<="
      value: 1.3
      text: >
        медиана записанного лентой спреда внутри окна должна быть <= 1.3 x медиана ТЕХ ЖЕ часов в
        другие дни (hour-matched, как и у диапазона). Окна с короткой реакцией держат предел 1.3
        жёстче обычных: у них и издержка, и горизонт короче, поэтому 30 % расширения спреда съедают
        большую долю стояния. Порог взят из констант движка, а не подогнан под измерение.
    # календарно опасные часы: avoid и с измерением, и без него
    hazard: [triple_swap_widening, broker_halt_server_midnight]
    action: avoid
    action_basis: >
      avoid как авторское ожидание до замера; окончательное значение
      выводит измерение (scripts/windows_evidence.py --apply сверяет его
      с этим полем и переписывает, если они разошлись).
    measured: null
    measured_note: "метрика не измерима по барам H1"

  - id: friday_us_data
    local_name: "Пятничные американские данные"
    scale: weekly
    timezone_kind: local_anchored
    season_region: us_eastern
    anchor_local: "08:00–11:00 Нью-Йорк"
    applies_to: [gold, silver, fx]
    utc: {start_minute: 720, end_minute: 900}
    utc_seasons:
      dst: {start_minute: 720, end_minute: 900}   # 12:00–15:00 UTC = 08:00–11:00 EDT
      std: {start_minute: 780, end_minute: 960}   # 13:00–16:00 UTC = 08:00–11:00 EST
    rule: {kind: weekly, weekday: 4}
    rule_note: >
      ДВЕ ошибки прежней ревизии, обе блокирующие. (1) Скобка 12:30–14:00 UTC не включала
      релизы, ради которых окно заведено: ISM и Michigan выходят в 10:00 ET, то есть в
      14:00 UTC летом и в 15:00 UTC зимой — ровно за правым краем. (2) Прежний PASS
      считался против ФОНА ВСЕХ СУТОК, а скобка лежала внутри перекрытия Лондон–Нью-Йорк
      (13:00–16:00 UTC): окно «пассило» потому, что послеобеденное время активнее ночи,
      а не потому, что пятница особенная. Теперь якорь — локальные часы релизов, а база —
      те же часы будних дней.
    why: >
      Регулярные пятничные релизы США: 08:30 ET — durable goods / personal income &
      outlays / MNI по Чикаго (когда они выпадают на пятницу), 10:00 ET — ISM и
      Michigan. Пятничный поток вынужден укладываться до закрытия книг на уикенд.
    expected: >
      Предзарегистрированная гипотеза — всплеск смещения в часы релизов ОТНОСИТЕЛЬНО тех
      же часов будних дней. Если после честного сопоставления разница исчезнет, это
      значит, что «пятничные данные» для нашего универсума — просто NY-послеобеденние
