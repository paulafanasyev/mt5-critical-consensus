  - id: monday_open_gap
    local_name: "Открытие недели: гэп выходных (вс 22:00 -> пн)"
    scale: weekly
    timezone_kind: utc_fixed
    applies_to: [gold, silver, fx]
    utc: {start_minute: 1320, end_minute: 180}
    rule: {kind: weekly, weekday: 6}
    rule_note: >
      Прежняя скобка начиналась в 00:00 UTC понедельника и потому пропускала сам момент
      открытия. ИЗМЕРЕНО на этой записи: после каждого из 17 weekend-разрывов первая
      часовая свеча EURUSD/GBPUSD открывается в 22:00 UTC воскресенья (17 из 17), у
      XAUUSD/XAGUSD — в 23:00 UTC (18 из 19). Скобка поставлена на измеренную точку:
      вс 22:00 -> пн 03:00 UTC, переходящая через полночь. Держится UTC-фиксированной
      намеренно: это серверный отсчёт брокера, а не сиднейские часы; реальный сиднейский
      open уезжает на час дважды в год, и это видно по покрытию баров, а не по скобке.
    why: >
      Гео- и макроновости выходных не имеют адресата до открытия книги; первый час
      торгов недели — где весь накопленный за уикенд риск превращается в цену на самой
      тонкой книге суток, с гарантированным гэпом по золоту.
    expected: >
      Предзарегистрированная гипотеза — смещение выше обычного; база сравнения — ТЕ ЖЕ
      часы других дней (hour-matched), иначе «гэп открытия недели» неотличим от «утро
      активнее ночи».
    criterion:
      metric: median_abs_rel_range_ratio_inside_vs_hour_matched_outside
      op: ">="
      value: 1.3
      text: >
        медиана |high-low|/mid внутри >= 1.3 x медиана той же скобки в дни, когда окно не
        срабатывает (записанные H1).
    # вторая критериальная линия окна: СПРЕД, то есть «чем тут торговать»,
    # а не только «заметно ли движение».
    spread_criterion:
      metric: median_spread_points_ratio_inside_vs_hour_matched_outside
      op: "<="
      value: 1.3
      text: >
        медиана записанного лентой спреда внутри окна должна быть <= 1.3 x медиана ТЕХ ЖЕ часов в
        другие дни (hour-matched, как и у диапазона). Окна с короткой реакцией держат предел 1.3
        жёстче обычных: у них и издержка, и горизонт короче, поэтому 30 % расширения спреда съедают
        большую долю стояния. Порог взят из констант движка, а не подогнан под измерение.
    # календарно опасные часы: avoid и с измерением, и без него
    hazard: [weekend_gap_reopen, first_bar_spread_widening, sunday_reopen_broker_halt]
    action: avoid
    action_basis: >
      avoid как авторское ожидание до замера; окончательное значение
