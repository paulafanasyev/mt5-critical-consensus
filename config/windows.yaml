  # COMEX: ЗОЛОТО И СЕРЕБРО РАЗДЕЛЕНЫ.
  # Прежнее окно comex_metals_roll было одним на оба металла, с одной скобкой
  # 14:00–16:00 UTC и с правилом дня «второй с конца рабочий день». Это неверно по
  # обеим половинам: у золота и серебра COMEX РАЗНЫЕ последние торговые дни месяца и
  # разные окончания американской сессии (у серебра торги ближнего контракта
  # прекращаются заметно раньше, чем у золота), а 14:00–16:00 UTC — это 09:00–11:00 по
  # Чикаго, то есть середина сессии, а не её конец, и к моменту остановки торгов окно
  # уже закрывалось. Спред разведён на два окна с собственными локальными скобками.
  # САМО ПРАВИЛО ДНЯ ОСТАЁТСЯ ГИПОТЕЗОЙ: регламент CME (окончание торгов ближнего
  # контракта по золоту и по серебру) на этой машине не верифицирован — ни выпиской,
  # ни импортированным календарём. Поэтому оба окна несут rule_status: hypothesis, а
  # их measured: читается строго наоборот: это замер НЕ тех часов, а НЕ тех дат.
  # Отношение и вердикт в блоке относятся к набору «второй с конца рабочий день»,
  # который может быть просто неверным; пока день ролла не сверен с rulebook CME,
  # никакое отношение по этим датам свидетельством о ролле не считается, каким бы
  # красивым оно ни вышло.

  - id: comex_gold_roll
    local_name: "Ролл COMEX: золото (американская сессия до конца торгов)"
    scale: monthly
    timezone_kind: local_anchored
