# Baseline: the rule the agent shipped with (fast/slow SMA cross plus momentum).
version: 1
mode: paper
symbol: EURUSD
timeframe: H1
history_bars: 4000
server_utc_offset_seconds: 7200
execution_mode: auto
ui_language: ru

account:
  expected_login: 114929502
  expected_server: MetaQuotes-Demo
  require_demo: true

symbol_spec:
  symbol: EURUSD
  point: 0.00001
  digits: 5
  tick_size: 0.00001
  tick_value: 1.0
  volume_min: 0.01
  volume_max: 500.0
  volume_step: 0.01
  spread_points: 3
  stops_level_points: 0

risk:
  risk_per_trade_fraction: 0.005
  max_open_positions: 1
  max_daily_loss_fraction: 0.25
  max_drawdown_fraction: 0.5
  min_risk_reward: 1.5
  max_spread_points: 25
  max_quote_age_seconds: 300

strategy:
  family: ema
  min_bars: 200
  ema_fast: 20
  ema_slow: 50
  atr_period: 14
  stop_atr_multiple: 2.0
  take_profit_risk_multiple: 2.0
  min_sma_gap_atr: 0.10
  min_momentum_abs: 0.0
  max_confidence: 0.95
schedule:
  window_start_minute_utc: 0
  window_end_minute_utc: 1440
  blocked_weekdays_utc: []
  blackout_windows_utc: []

kill_switch:
  active: false
  reason: "forward comparison run"


